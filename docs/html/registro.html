<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProyecTIC - Acceso</title>
    <!--CSS:-->
    <link rel="stylesheet" href="../css/global.css">
</head>
<body class="bg-alt">

    <!--Cabecera:-->
    <header class="main-header">
        <div class="header-left">
            <a href="index.html" class="logo-link">
                <img src="../logo.png" alt="ProyecTIC Logo" class="logo">
            </a>
            <nav class="main-nav">
                <a href="tableros-publicos.html">Tableros públicos</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="registro.html" class="btn btn-outline">Iniciar sesión</a>
            <a href="registro.html" class="btn btn-primary">Registrarse</a>
        </div>
    </header>

    <!--Contenido principal:-->
    <main class="auth-main">
        <div class="auth-card">
            <!--Pestañas:-->
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="tab-btn active">Iniciar sesión</button>
                <button type="button" id="tab-register" class="tab-btn">Registrarse</button>
            </div>

            <!--Formulario:-->
            <form id="auth-form" action="mis-tableros.html">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="nombre@correo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group" id="confirm-password-group" style="display: none;">
                    <label for="password-confirm">Repetir contraseña</label>
                    <input type="password" id="password-confirm" placeholder="••••••••">
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <!--Enlaces de ayuda:-->
            <div class="auth-links">
                <a href="#" id="link-forgot" class="text-sm">¿Has olvidado tu contraseña?</a>
                <a href="#" id="link-toggle" class="text-sm">¿No tienes cuenta? Regístrate</a>
            </div>
        </div>
    </main>

    <!--Pie de página:-->
    <footer class="main-footer">
        <div class="footer-left">
            <span>&copy; 2026 ProyecTIC &middot; Sistemas Web I</span>
        </div>
        <div class="footer-right">
            <a href="contacto.html">Contacto</a> &middot;
            <a href="sobre-nosotros.html">Sobre nosotros</a>
        </div>
    </footer>

    <!--JS:-->
    <script src="../js/global.js"></script>
</body>
</html>
